<!DOCTYPE html><html><head><meta charset="utf-8"/><style>
*{margin:0;box-sizing:border-box;}
html,body{width:1200px;height:630px;}
.card{width:1200px;height:630px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff;
  background:linear-gradient(160deg,#4aa8e0 0%,#2f86d5 55%,#2570c4 100%);}
.brandrow{display:flex;align-items:center;gap:18px;margin-bottom:30px;}
.brandrow img{width:64px;height:64px;object-fit:contain;filter:brightness(0) invert(1);}
.brandrow .nm{font-size:40px;font-weight:800;letter-spacing:-.02em;}
.eyebrow{font-size:30px;font-weight:700;opacity:.92;margin-bottom:8px;}
.wordmark{font-size:96px;font-weight:800;letter-spacing:-.035em;line-height:1;margin-bottom:34px;}
.wordmark .a{color:#bfe2f7;}.wordmark .b{color:#d7eefb;}
.tag{font-size:30px;line-height:1.5;max-width:880px;color:rgba(255,255,255,.92);}
.tag .acc{color:#d7eefb;font-weight:600;}
.trust{display:flex;gap:36px;margin-top:46px;font-size:21px;color:rgba(255,255,255,.92);}
.trust span{display:flex;align-items:center;gap:9px;}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);align-self:center;}
</style></head><body>
<div class="card">
  <div class="brandrow"><img src="file:///Users/williamramirez/repos/langchain-agent/public/images/ndLogo.png"/><div class="nm">NoteDoctorAi</div></div>
  <div class="eyebrow">Welcome to</div>
  <div class="wordmark">Note<span class="a">Doctor</span><span class="b">Ai</span></div>
  <div class="tag"><span class="acc">Authorization readiness</span> screening that saves time, reduces errors, and ensures compliance.</div>
  <div class="trust"><span>✓ HIPAA Compliant</span><span class="dot"></span><span>🛡 Secure</span><span class="dot"></span><span>Trusted by Healthcare Professionals</span></div>
</div></body></html>
